name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cache Embedding Model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Prefetch Embedding Model
        run: node scripts/prefetch-model.mjs

      - name: Test
        run: npx vitest run --reporter=basic

      - name: Bin Smoke Test
        run: npm run smoke:bin

      - name: Pack Check
        run: npm run pack:check

  release-gate:
    # A version bump that never reaches npm is invisible: the repository looks
    # shipped and every install serves the older build. The original author's
    # gate against registry.npmjs.org — DISABLED on this fork: the npm name
    # "mnemos" is occupied by an unrelated 0.0.1 package, so this fork can
    # never publish under it and the gate can never pass. Re-enable if this
    # fork ever publishes under a scoped name.
    if: false && github.event_name == 'push' && github.repository == 'cheney-enterprises/mnemos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate dates the bump from the commit that introduced the version
          # string. A shallow clone cannot find it.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release Gate
        run: npm run check:release
